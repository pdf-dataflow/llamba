[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "llamba"
version = "0.1.13"
description = "A library to merge BioAge models with LLMs!"
readme = "README.md"
authors = [
  "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
  "Mike Krivonosov <krivonosov@itmm.unn.ru>"
]
maintainers = [
    "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
    "Mike Krivonosov <krivonosov@itmm.unn.ru>"
]
repository = "https://github.com/mike-live/llamba"

[tool.poetry.dependencies]
python = "3.11.*"
numpy = "^1" 
pandas = "2.2.3"
scipy = "^1.12.0"
omegaconf = "*"
scikit-learn = "1.5.2"
openpyxl = "3.1.5"
requests = "^2.32.5"
qdrant-client = {version = "^1.16.1", extras = ["fastembed"]}
llamba-library = {git = "git@github.com:SermanVS/llamba_library.git", rev = "stage2"}

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
